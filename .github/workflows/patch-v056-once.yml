name: patch-v056-once
on:
  push:
    branches: [fix/button-menus-label-orientation-v0.5.6]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/button-menus-label-orientation-v0.5.6
      - name: Apply v0.5.6 changes
        shell: python
        run: |
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # Route-leg labels: restore the readable orientation from 0.5.4,
          # but choose the placement side independently.  This prevents the
          # whole label from being reversed while still keeping it visually
          # above shallow legs and to the left of steep legs.
          # ------------------------------------------------------------
          p = Path('src/route_labels.cpp')
          s = p.read_text()
          old = '''  // Choose one canonical reading direction for every leg.  Screen-space Y\n  // grows downwards.  Keeping the baseline angle in [0, 180) means the text\n  // is always readable by rotating the screen counter-clockwise (to the left),\n  // never by turning it to the right.\n  double screen_angle = std::atan2(dy, dx);\n  if (screen_angle < 0.0) screen_angle += M_PI;\n  double ux = std::cos(screen_angle);\n  double uy = std::sin(screen_angle);\n\n  // Always use the same side of the displayed leg.  This is the left/upper\n  // side after the corresponding counter-clockwise screen rotation.\n  const double nx = uy;\n  const double ny = -ux;\n'''
          new = '''  // Text direction: use the same readable orientation as v0.5.4.  The\n  // baseline still follows the route leg, but is flipped when needed so the\n  // characters are not rendered upside down.\n  double ux = dx / length;\n  double uy = dy / length;\n  if (ux < 0.0 || (std::abs(ux) < 1e-9 && uy > 0.0)) {\n    ux = -ux;\n    uy = -uy;\n  }\n\n  // Placement direction is deliberately independent of text direction.\n  // Shallow legs use the visual upper side; steep legs use the visual left\n  // side.  Therefore flipping the text for readability can never move the\n  // label to the opposite side of the route line.\n  double nx = dy / length;\n  double ny = -dx / length;\n  if (std::abs(dx) >= std::abs(dy)) {\n    if (ny > 0.0) { nx = -nx; ny = -ny; }\n  } else {\n    if (nx > 0.0) { nx = -nx; ny = -ny; }\n  }\n'''
          if old not in s:
              raise SystemExit('v0.5.5 route-label orientation block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # Route Report CSV route selection -> buttons.
          # ------------------------------------------------------------
          p = Path('src/route_report.cpp')
          s = p.read_text()
          old = '''  wxSingleChoiceDialog route_dialog(\n      m_dialog ? static_cast<wxWindow*>(m_dialog) : m_parent_window,\n      _("Select the OpenCPN route to include in the report."),\n      _("Route Report - CSV"), choices);\n  if (route_dialog.ShowModal() != wxID_OK) {\n    SetStatus(_("Route Report cancelled."));\n    return;\n  }\n\n  const int selected = route_dialog.GetSelection();\n'''
          new = '''  const int selected = ShowActionButtons(\n      _("Route Report - CSV"),\n      _("Select the OpenCPN route to include in the report."),\n      choices);\n  if (selected < 0) {\n    SetStatus(_("Route Report cancelled."));\n    return;\n  }\n\n'''
          if old not in s:
              raise SystemExit('CSV route choice dialog not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # Route Report PDF route selection -> buttons.
          # ------------------------------------------------------------
          p = Path('src/route_report_pdf.cpp')
          s = p.read_text()
          old = '''  wxSingleChoiceDialog pick(parent,\n                            _("Select the OpenCPN route to include in the PDF report."),\n                            _("Route Report - PDF"), choices);\n  if (pick.ShowModal() != wxID_OK) return;\n  const int selected = pick.GetSelection();\n'''
          new = '''  const int selected = ShowActionButtons(\n      _("Route Report - PDF"),\n      _("Select the OpenCPN route to include in the PDF report."),\n      choices);\n  if (selected < 0) return;\n'''
          if old not in s:
              raise SystemExit('PDF route choice dialog not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # Route GPX route selection -> buttons.
          # ------------------------------------------------------------
          p = Path('src/route_gpx.cpp')
          s = p.read_text()
          old = '''  wxSingleChoiceDialog route_dialog(\n      m_dialog\n          ? static_cast<wxWindow*>(m_dialog)\n          : m_parent_window,\n      _("Select the route to package."),\n      _("Export Route GPX"),\n      choices);\n\n  if (route_dialog.ShowModal() != wxID_OK)\n    return;\n\n  const int selected =\n      route_dialog.GetSelection();\n'''
          new = '''  const int selected = ShowActionButtons(\n      _("Export Route GPX"),\n      _("Select the route to package."),\n      choices);\n\n  if (selected < 0)\n    return;\n'''
          if old not in s:
              raise SystemExit('GPX route choice dialog not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # No remaining list/choice dialogs in the plugin source.  Action
          # menus must use buttons; text-entry dialogs remain only where the
          # user must type a numeric/name value.
          leftovers = []
          for source in Path('src').glob('*.cpp'):
            text = source.read_text()
            if 'wxSingleChoiceDialog' in text or 'wxMultiChoiceDialog' in text:
              leftovers.append(str(source))
          if leftovers:
            raise SystemExit('choice dialogs still remain: ' + ', '.join(leftovers))

          # ------------------------------------------------------------
          # Slightly dimmer Route Toolbar SVG so it blends with OpenCPN's
          # toolbar icons instead of looking bright white.
          # ------------------------------------------------------------
          p = Path('src/route_toolbar_pi.cpp')
          s = p.read_text()
          s = s.replace('constexpr int kPluginVersionPatch = 5;',
                        'constexpr int kPluginVersionPatch = 6;', 1)
          s = s.replace('stroke="#eef1f3"', 'stroke="#c7ccd1"')
          p.write_text(s)

          # ------------------------------------------------------------
          # Documentation.
          # ------------------------------------------------------------
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('**Route Toolbar 0.5.5**', '**Route Toolbar 0.5.6**', 1)
          s = s.replace('The label is placed above the route leg when screen space permits.',
                        'The label follows the route-leg angle and is placed immediately above shallow legs or immediately to the visual left of steep legs.', 1)
          s = s.replace('The toolbar provides **Hide all yellow notes / View all yellow notes**.',
                        'The toolbar provides **Hide notes and leg info / View notes and leg info**.', 1)
          p.write_text(s)

          p = Path('docs/BUILDING.md')
          s = p.read_text().replace('- Route Toolbar 0.5.5', '- Route Toolbar 0.5.6', 1)
          p.write_text(s)

          p = Path('docs/SPEC.md')
          s = p.read_text().replace('## Version 0.5.5 scope', '## Version 0.5.6 scope', 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.5.6 — 2026-10-12\n\n### Changed\n\n- corrected route-leg label orientation so text is no longer upside down\n- route-leg labels stay immediately above shallow legs or on the visual left side of steep legs, independently of text-direction flipping\n- all Route Toolbar selection menus now use action buttons instead of list/choice fields\n- Route Report CSV/PDF route selection and Route GPX route selection now use button dialogs\n- Route Toolbar icon linework is softened from bright white to a subdued grey-white\n\n'''
          if '## 0.5.6 — 2026-10-12' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Route Toolbar CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/route_labels.cpp src/route_report.cpp src/route_report_pdf.cpp src/route_gpx.cpp src/route_toolbar_pi.cpp README.md CHANGELOG.md docs/BUILDING.md docs/SPEC.md
          git commit -m "Route Toolbar 0.5.6 button menus and label orientation fix"
          git push origin HEAD:fix/button-menus-label-orientation-v0.5.6
