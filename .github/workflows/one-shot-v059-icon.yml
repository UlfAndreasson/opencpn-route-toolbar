name: One-shot v0.5.9 plugin icon update

on:
  push:
    branches:
      - ui/plugin-icon-v0.5.9

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/plugin-icon-v0.5.9

      - name: Apply source and version updates
        run: |
          if grep -q 'constexpr int kPluginVersionPatch = 9;' src/route_toolbar_pi.cpp; then
            echo "v0.5.9 source update already applied"
            exit 0
          fi
          python3 -c "from pathlib import Path; import re,base64; p=Path('src/route_toolbar_pi.cpp'); t=p.read_text(); t=t.replace('constexpr int kPluginVersionPatch = 8;','constexpr int kPluginVersionPatch = 9;',1); x=base64.b64decode('').decode(); t,n=re.subn(r'static const char\\* route_toolbar_xpm\\[\\] = \\{.*?\\};',x,t,count=1,flags=re.S); assert n==1; p.write_text(t)"
          python3 -c "from pathlib import Path; p=Path('CMakeLists.txt'); p.write_text(p.read_text().replace('project(route_toolbar_pi VERSION 0.5.8 LANGUAGES CXX)','project(route_toolbar_pi VERSION 0.5.9 LANGUAGES CXX)',1))"
          python3 -c "from pathlib import Path; p=Path('packaging/macos/make-package.sh'); p.write_text(p.read_text().replace('VERSION=\"\${1:-0.5.8}\"','VERSION=\"\${1:-0.5.9}\"',1))"
          python3 -c "from pathlib import Path; p=Path('README.md'); t=p.read_text().replace('**Route Toolbar 0.5.8**','**Route Toolbar 0.5.9**',1); t=t.replace('> **Current status:** development preview. The plugin currently builds and runs on macOS Apple Silicon and is installed manually. OpenCPN Plugin Manager packaging and wider platform builds are the next release step.','> **Current status:** development preview. The macOS Apple Silicon package has been successfully imported through OpenCPN Plugin Manager. Catalog distribution, universal macOS packaging and wider platform builds are the next release steps.',1); p.write_text(t)"
          python3 -c "from pathlib import Path; p=Path('CHANGELOG.md'); t=p.read_text(); marker='# Changelog\\n\\n'; entry='## 0.5.9 — 2026-10-12\\n\\n### Changed\\n\\n- Plugin Manager icon now matches the Route Toolbar chart-toolbar icon instead of using the old black route glyph\\n- macOS Apple Silicon Plugin Manager package version advanced to 0.5.9 after successful imported-plugin testing\\n\\n'; p.write_text(t if entry in t else t.replace(marker,marker+entry,1))"

      - name: Commit and push
        run: |
          if grep -q 'constexpr int kPluginVersionPatch = 8;' src/route_toolbar_pi.cpp; then
            echo "Source update did not apply"
            exit 1
          fi
          git config user.name "Ulf Andreasson"
          git config user.email "ulf@andreasson.co.uk"
          git add src/route_toolbar_pi.cpp CMakeLists.txt packaging/macos/make-package.sh README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Route Toolbar 0.5.9: align Plugin Manager icon"
          git push origin HEAD:ui/plugin-icon-v0.5.9
