name: patch-v052-once
on:
  push:
    branches: [fix/route-leg-label-placement-v0.5.2]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/route-leg-label-placement-v0.5.2
      - name: Apply v0.5.2 version and docs
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/route_toolbar_pi.cpp')
          s = p.read_text()
          s = s.replace('constexpr int kPluginVersionPatch = 1;', 'constexpr int kPluginVersionPatch = 2;', 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text().replace('**Route Toolbar 0.5.1**', '**Route Toolbar 0.5.2**', 1)
          p.write_text(s)

          p = Path('docs/BUILDING.md')
          s = p.read_text().replace('- Route Toolbar 0.5.1', '- Route Toolbar 0.5.2', 1)
          p.write_text(s)

          p = Path('docs/SPEC.md')
          s = p.read_text().replace('## Version 0.5.1 scope', '## Version 0.5.2 scope', 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.5.2 — 2026-10-12\n\n### Changed\n\n- route-leg course/distance labels are anchored to the midpoint of each leg\n- mostly horizontal legs place the label immediately above the route line\n- mostly vertical legs place the label immediately to the left of the route line\n- route-leg labels no longer clamp to viewport edges, preventing apparent label movement while panning\n- route-leg labels now follow the global **Hide/View all yellow notes** control\n\n'''
          if '## 0.5.2 — 2026-10-12' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Route Toolbar CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/route_toolbar_pi.cpp README.md CHANGELOG.md docs/BUILDING.md docs/SPEC.md
          git commit -m "Bump Route Toolbar to 0.5.2 and document leg labels"
          git push origin HEAD:fix/route-leg-label-placement-v0.5.2
