name: patch-v057-once
on:
  push:
    branches: [ui/select-all-icon-v0.5.7]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/select-all-icon-v0.5.7
      - name: Apply v0.5.7 changes
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/route_toolbar_pi.cpp')
          s = p.read_text()

          s = s.replace('constexpr int kPluginVersionPatch = 6;',
                        'constexpr int kPluginVersionPatch = 7;', 1)
          s = s.replace('stroke="#c7ccd1"', 'stroke="#aeb4ba"')

          s = s.replace(
              'wxLC_REPORT | wxLC_SINGLE_SEL | wxBORDER_SUNKEN);',
              'wxLC_REPORT | wxBORDER_SUNKEN);', 1)

          old = '''  auto set_selected_visibility = [&](bool visible) {\n    const long row =\n        list->GetNextItem(-1, wxLIST_NEXT_ALL, wxLIST_STATE_SELECTED);\n    if (row < 0) return;\n\n    const long code = list->GetItemData(row);\n    const int type = static_cast<int>(code / 1000000L);\n    const size_t index = static_cast<size_t>(code % 1000000L);\n\n    if (type == 1 && index < m_ebl_vrms.size())\n      m_ebl_vrms[index].visible = visible;\n    else if (type == 2 && index < m_pils.size())\n      m_pils[index].visible = visible;\n    else if (type == 3 && index < m_turns.size())\n      m_turns[index].visible = visible;\n    else\n      return;\n\n    SavePersistentState();\n    populate();\n    if (m_parent_window) RequestRefresh(m_parent_window);\n  };\n'''
          new = '''  auto set_selected_visibility = [&](bool visible) {\n    bool changed = false;\n    long row = -1;\n    while ((row = list->GetNextItem(\n                row, wxLIST_NEXT_ALL, wxLIST_STATE_SELECTED)) >= 0) {\n      const long code = list->GetItemData(row);\n      const int type = static_cast<int>(code / 1000000L);\n      const size_t index = static_cast<size_t>(code % 1000000L);\n\n      if (type == 1 && index < m_ebl_vrms.size()) {\n        m_ebl_vrms[index].visible = visible;\n        changed = true;\n      } else if (type == 2 && index < m_pils.size()) {\n        m_pils[index].visible = visible;\n        changed = true;\n      } else if (type == 3 && index < m_turns.size()) {\n        m_turns[index].visible = visible;\n        changed = true;\n      }\n    }\n\n    if (!changed) return;\n    SavePersistentState();\n    populate();\n    if (m_parent_window) RequestRefresh(m_parent_window);\n  };\n'''
          if old not in s:
              raise SystemExit('selected visibility block not found')
          s = s.replace(old, new, 1)

          old = '''  auto* row1 = new wxBoxSizer(wxHORIZONTAL);\n  auto* show_selected = new wxButton(&dialog, wxID_ANY, _("Show selected"));\n  auto* hide_selected = new wxButton(&dialog, wxID_ANY, _("Hide selected"));\n  auto* show_all = new wxButton(&dialog, wxID_ANY, _("Show all"));\n  auto* hide_all = new wxButton(&dialog, wxID_ANY, _("Hide all"));\n\n  row1->Add(show_selected, 0, wxRIGHT, 6);\n  row1->Add(hide_selected, 0, wxRIGHT, 14);\n  row1->Add(show_all, 0, wxRIGHT, 6);\n  row1->Add(hide_all, 0);\n'''
          new = '''  auto* row1 = new wxBoxSizer(wxHORIZONTAL);\n  auto* select_all = new wxButton(&dialog, wxID_ANY, _("Select all"));\n  auto* show_selected = new wxButton(&dialog, wxID_ANY, _("Show selected"));\n  auto* hide_selected = new wxButton(&dialog, wxID_ANY, _("Hide selected"));\n  auto* show_all = new wxButton(&dialog, wxID_ANY, _("Show all"));\n  auto* hide_all = new wxButton(&dialog, wxID_ANY, _("Hide all"));\n\n  row1->Add(select_all, 0, wxRIGHT, 14);\n  row1->Add(show_selected, 0, wxRIGHT, 6);\n  row1->Add(hide_selected, 0, wxRIGHT, 14);\n  row1->Add(show_all, 0, wxRIGHT, 6);\n  row1->Add(hide_all, 0);\n'''
          if old not in s:
              raise SystemExit('object manager button row not found')
          s = s.replace(old, new, 1)

          old = '''  show_selected->Bind(wxEVT_BUTTON, [&](wxCommandEvent&) {\n    set_selected_visibility(true);\n  });\n'''
          new = '''  select_all->Bind(wxEVT_BUTTON, [&](wxCommandEvent&) {\n    for (long row = 0; row < list->GetItemCount(); ++row)\n      list->SetItemState(row, wxLIST_STATE_SELECTED, wxLIST_STATE_SELECTED);\n  });\n  show_selected->Bind(wxEVT_BUTTON, [&](wxCommandEvent&) {\n    set_selected_visibility(true);\n  });\n'''
          if old not in s:
              raise SystemExit('show-selected bind block not found')
          s = s.replace(old, new, 1)

          old = '''  del->Bind(wxEVT_BUTTON, [&](wxCommandEvent&) {\n    const long row =\n        list->GetNextItem(-1, wxLIST_NEXT_ALL, wxLIST_STATE_SELECTED);\n    if (row < 0) return;\n\n    const long code = list->GetItemData(row);\n    const int type = static_cast<int>(code / 1000000L);\n    const size_t index = static_cast<size_t>(code % 1000000L);\n\n    if (wxMessageBox(_("Delete selected object?"), _("Route Objects"),\n                     wxYES_NO | wxNO_DEFAULT | wxICON_WARNING,\n                     &dialog) != wxYES)\n      return;\n\n    if (type == 1 && index < m_ebl_vrms.size())\n      m_ebl_vrms.erase(m_ebl_vrms.begin() + index);\n    else if (type == 2 && index < m_pils.size())\n      m_pils.erase(m_pils.begin() + index);\n    else if (type == 3 && index < m_turns.size())\n      m_turns.erase(m_turns.begin() + index);\n    else\n      return;\n\n    SavePersistentState();\n    populate();\n    if (m_parent_window) RequestRefresh(m_parent_window);\n  });\n'''
          new = '''  del->Bind(wxEVT_BUTTON, [&](wxCommandEvent&) {\n    std::vector<size_t> ebl_indices;\n    std::vector<size_t> pil_indices;\n    std::vector<size_t> turn_indices;\n\n    long row = -1;\n    while ((row = list->GetNextItem(\n                row, wxLIST_NEXT_ALL, wxLIST_STATE_SELECTED)) >= 0) {\n      const long code = list->GetItemData(row);\n      const int type = static_cast<int>(code / 1000000L);\n      const size_t index = static_cast<size_t>(code % 1000000L);\n      if (type == 1 && index < m_ebl_vrms.size()) ebl_indices.push_back(index);\n      else if (type == 2 && index < m_pils.size()) pil_indices.push_back(index);\n      else if (type == 3 && index < m_turns.size()) turn_indices.push_back(index);\n    }\n\n    const size_t count = ebl_indices.size() + pil_indices.size() + turn_indices.size();\n    if (count == 0) return;\n\n    const wxString question = count == 1\n        ? _("Delete selected object?")\n        : wxString::Format(_("Delete %lu selected objects?"),\n                           static_cast<unsigned long>(count));\n    if (wxMessageBox(question, _("Route Objects"),\n                     wxYES_NO | wxNO_DEFAULT | wxICON_WARNING,\n                     &dialog) != wxYES)\n      return;\n\n    auto erase_descending = [](auto& items, std::vector<size_t>& indices) {\n      std::sort(indices.rbegin(), indices.rend());\n      indices.erase(std::unique(indices.begin(), indices.end()), indices.end());\n      for (size_t index : indices) {\n        if (index < items.size()) items.erase(items.begin() + index);\n      }\n    };\n    erase_descending(m_ebl_vrms, ebl_indices);\n    erase_descending(m_pils, pil_indices);\n    erase_descending(m_turns, turn_indices);\n\n    SavePersistentState();\n    populate();\n    if (m_parent_window) RequestRefresh(m_parent_window);\n  });\n'''
          if old not in s:
              raise SystemExit('delete-selected block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text().replace('**Route Toolbar 0.5.6**', '**Route Toolbar 0.5.7**', 1)
          s = s.replace('Objects can be shown, hidden or deleted without deleting the source OpenCPN route.',
                        'Objects can be multi-selected, selected all at once, shown, hidden or deleted without deleting the source OpenCPN route.', 1)
          p.write_text(s)

          p = Path('docs/BUILDING.md')
          s = p.read_text().replace('- Route Toolbar 0.5.6', '- Route Toolbar 0.5.7', 1)
          p.write_text(s)

          p = Path('docs/SPEC.md')
          s = p.read_text().replace('## Version 0.5.6 scope', '## Version 0.5.7 scope', 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.5.7 — 2026-10-12\n\n### Changed\n\n- softened the Route Toolbar icon linework further to better match OpenCPN's grey toolbar icons\n- Route Objects now supports multi-selection and a Select all button\n- Show selected, Hide selected and Delete selected now act on every selected object\n\n'''
          if '## 0.5.7 — 2026-10-12' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Route Toolbar CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/route_toolbar_pi.cpp README.md CHANGELOG.md docs/BUILDING.md docs/SPEC.md
          git commit -m "Route Toolbar 0.5.7 select all and softer icon"
          git push origin HEAD:ui/select-all-icon-v0.5.7
