name: patch-v054-once
on:
  push:
    branches: [fix/route-leg-rotated-labels-v0.5.4]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/route-leg-rotated-labels-v0.5.4
      - name: Apply v0.5.4 version and docs
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/route_toolbar_pi.cpp')
          s = p.read_text().replace('constexpr int kPluginVersionPatch = 3;', 'constexpr int kPluginVersionPatch = 4;', 1)
          p.write_text(s)
          p = Path('README.md')
          s = p.read_text().replace('**Route Toolbar 0.5.3**', '**Route Toolbar 0.5.4**', 1)
          p.write_text(s)
          p = Path('docs/BUILDING.md')
          s = p.read_text().replace('- Route Toolbar 0.5.3', '- Route Toolbar 0.5.4', 1)
          p.write_text(s)
          p = Path('docs/SPEC.md')
          s = s = p.read_text().replace('## Version 0.5.3 scope', '## Version 0.5.4 scope', 1)
          p.write_text(s)
          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.5.4 — 2026-10-12\n\n### Changed\n\n- route-leg course/distance text is rotated to follow the exact route-leg angle\n- 090/270 degree legs remain horizontal, 000/180 degree legs become vertical, and diagonal legs follow their line angle\n- labels remain centred near the leg midpoint with approximately 1 px clearance from the route line\n- OpenGL and wxDC rendering use the same rotated placement\n\n'''
          if '## 0.5.4 — 2026-10-12' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Route Toolbar CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/route_toolbar_pi.cpp README.md CHANGELOG.md docs/BUILDING.md docs/SPEC.md
          git commit -m "Bump Route Toolbar to 0.5.4"
          git push origin HEAD:fix/route-leg-rotated-labels-v0.5.4
