name: patch-v055-once
on:
  push:
    branches: [ui/route-report-gpx-leg-info-v0.5.5]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/route-report-gpx-leg-info-v0.5.5
      - name: Apply v0.5.5 changes
        shell: python
        run: |
          from pathlib import Path
          import re

          # Route-leg labels: keep text on one consistent side and orient it so
          # rotating the screen counter-clockwise makes it readable.
          p = Path('src/route_labels.cpp')
          s = p.read_text()
          old = '''  double ux = dx / length;\n  double uy = dy / length;\n\n  // Keep the text readable left-to-right while preserving the exact line\n  // direction. A purely vertical leg is oriented upward so the annotation\n  // naturally sits on the left side of the route line.\n  if (ux < 0.0 || (std::abs(ux) < 1e-9 && uy > 0.0)) {\n    ux = -ux;\n    uy = -uy;\n  }\n\n  // Screen-space normal pointing to the visual "upper/left" side of the leg.\n  const double nx = uy;\n  const double ny = -ux;\n'''
          new = '''  // Choose one canonical reading direction for every leg.  Screen-space Y\n  // grows downwards.  Keeping the baseline angle in [0, 180) means the text\n  // is always readable by rotating the screen counter-clockwise (to the left),\n  // never by turning it to the right.\n  double screen_angle = std::atan2(dy, dx);\n  if (screen_angle < 0.0) screen_angle += M_PI;\n  double ux = std::cos(screen_angle);\n  double uy = std::sin(screen_angle);\n\n  // Always use the same side of the displayed leg.  This is the left/upper\n  // side after the corresponding counter-clockwise screen rotation.\n  const double nx = uy;\n  const double ny = -ux;\n'''
          if old not in s:
              raise SystemExit('route_labels orientation block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Public wrapper around the existing button-dialog helper so Report
          # and GPX can use the same UI style as EBL/VRM edit actions.
          p = Path('include/route_toolbar_pi.h')
          s = p.read_text()
          needle = '  void RouteGpx();\n'
          if needle not in s:
              raise SystemExit('RouteGpx declaration not found')
          s = s.replace(needle, needle + '  int ShowActionButtons(const wxString& title, const wxString& prompt,\n                        const wxArrayString& labels);\n', 1)
          p.write_text(s)

          p = Path('src/route_toolbar_pi.cpp')
          s = p.read_text()
          s = s.replace('constexpr int kPluginVersionPatch = 4;', 'constexpr int kPluginVersionPatch = 5;', 1)
          needle = 'int route_toolbar_pi::GetToolbarToolCount() { return 1; }\n'
          impl = '''int route_toolbar_pi::GetToolbarToolCount() { return 1; }\n\nint route_toolbar_pi::ShowActionButtons(const wxString& title,\n                                        const wxString& prompt,\n                                        const wxArrayString& labels) {\n  return ShowRouteToolbarActionButtons(\n      m_dialog ? static_cast<wxWindow*>(m_dialog) : m_parent_window,\n      title, prompt, labels);\n}\n'''
          if needle not in s:
              raise SystemExit('GetToolbarToolCount implementation not found')
          s = s.replace(needle, impl, 1)
          p.write_text(s)

          # Route Report: replace format choice field/list with action buttons.
          p = Path('src/route_report.cpp')
          s = p.read_text()
          pattern = re.compile(r'void route_toolbar_pi::ExportRouteReport\(\) \{.*?\n\}\n\nvoid route_toolbar_pi::ExportRouteCsvReport\(\) \{', re.S)
          replacement = '''void route_toolbar_pi::ExportRouteReport() {\n  CancelInteractiveTool();\n\n  wxArrayString actions;\n  actions.Add(_("Export PDF - A4 landscape"));\n  actions.Add(_("Export CSV - spreadsheet/data"));\n\n  const int selected = ShowActionButtons(\n      _("Route Report"),\n      _("What do you want to create?"),\n      actions);\n  if (selected < 0) return;\n\n  if (selected == 0)\n    ExportRoutePdfReport();\n  else\n    ExportRouteCsvReport();\n}\n\nvoid route_toolbar_pi::ExportRouteCsvReport() {'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('ExportRouteReport function not replaced')
          p.write_text(s)

          # Route GPX: same action-button presentation.
          p = Path('src/route_gpx.cpp')
          s = p.read_text()
          pattern = re.compile(r'void route_toolbar_pi::RouteGpx\(\) \{.*?\n\}\n\n\nvoid route_toolbar_pi::ExportRouteGpxPackage\(\) \{', re.S)
          replacement = '''void route_toolbar_pi::RouteGpx() {\n  CancelInteractiveTool();\n\n  wxArrayString actions;\n  actions.Add(_("Export complete route package..."));\n  actions.Add(_("Import route package..."));\n\n  const int selected = ShowActionButtons(\n      _("Route GPX"),\n      _("What do you want to do with Route Toolbar GPX?"),\n      actions);\n  if (selected < 0) return;\n\n  if (selected == 0)\n    ExportRouteGpxPackage();\n  else\n    ImportRouteGpxPackage();\n}\n\n\nvoid route_toolbar_pi::ExportRouteGpxPackage() {'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('RouteGpx function not replaced')
          p.write_text(s)

          # Clearer visibility toggle wording.
          p = Path('src/route_toolbar_dialog.cpp')
          s = p.read_text()
          s = s.replace('_("View all yellow notes")', '_("View notes and leg info")')
          s = s.replace('_("Hide all yellow notes")', '_("Hide notes and leg info")')
          p.write_text(s)

          # Documentation/version text.
          p = Path('README.md')
          s = p.read_text().replace('**Route Toolbar 0.5.4**', '**Route Toolbar 0.5.5**', 1)
          p.write_text(s)
          p = Path('docs/BUILDING.md')
          s = p.read_text().replace('- Route Toolbar 0.5.4', '- Route Toolbar 0.5.5', 1)
          p.write_text(s)
          p = Path('docs/SPEC.md')
          s = p.read_text().replace('## Version 0.5.4 scope', '## Version 0.5.5 scope', 1)
          p.write_text(s)
          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.5.5 — 2026-10-12\n\n### Changed\n\n- route-leg course/distance labels use one consistent reading direction: rotate the screen left to read them\n- leg labels stay on the same side of the route line instead of alternating sides\n- Route Report uses action buttons for PDF/CSV instead of a choice field\n- Route GPX uses action buttons for export/import instead of a choice field\n- the visibility button is now labelled Hide/View notes and leg info\n\n'''
          if '## 0.5.5 — 2026-10-12' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Route Toolbar CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/route_labels.cpp src/route_toolbar_pi.cpp src/route_toolbar_dialog.cpp src/route_report.cpp src/route_gpx.cpp include/route_toolbar_pi.h README.md CHANGELOG.md docs/BUILDING.md docs/SPEC.md
          git commit -m "Route Toolbar 0.5.5 UI and leg label refinements"
          git push origin HEAD:ui/route-report-gpx-leg-info-v0.5.5
