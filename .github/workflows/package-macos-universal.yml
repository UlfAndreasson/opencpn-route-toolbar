name: macOS universal Plugin Manager package

on:
  workflow_dispatch:
  push:
    branches:
      - ci/cross-platform-v0.5.9
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/package-macos-universal.yml'

jobs:
  build-arm64:
    name: Build macOS arm64 slice
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake wxwidgets@3.2

      - name: Configure
        run: |
          WX_PREFIX="$(brew --prefix wxwidgets@3.2)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DwxWidgets_CONFIG_EXECUTABLE="$WX_PREFIX/bin/wx-config-3.2"

      - name: Build and verify
        run: |
          cmake --build build --config Release -j 2
          lipo -info build/libroute_toolbar_pi.dylib
          lipo -info build/libroute_toolbar_pi.dylib | grep -q 'arm64'
          if otool -L build/libroute_toolbar_pi.dylib | grep -E '/opt/homebrew|/usr/local/Cellar'; then
            echo "Homebrew runtime dependency remains in arm64 plugin" >&2
            exit 1
          fi

      - name: Upload arm64 slice
        uses: actions/upload-artifact@v4
        with:
          name: route-toolbar-macos-arm64-slice
          path: build/libroute_toolbar_pi.dylib

  build-x86_64:
    name: Build macOS x86_64 slice
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake wxwidgets@3.2

      - name: Configure
        run: |
          WX_PREFIX="$(brew --prefix wxwidgets@3.2)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DwxWidgets_CONFIG_EXECUTABLE="$WX_PREFIX/bin/wx-config-3.2"

      - name: Build and verify
        run: |
          cmake --build build --config Release -j 2
          lipo -info build/libroute_toolbar_pi.dylib
          lipo -info build/libroute_toolbar_pi.dylib | grep -q 'x86_64'
          if otool -L build/libroute_toolbar_pi.dylib | grep -E '/opt/homebrew|/usr/local/Cellar'; then
            echo "Homebrew runtime dependency remains in x86_64 plugin" >&2
            exit 1
          fi

      - name: Upload x86_64 slice
        uses: actions/upload-artifact@v4
        with:
          name: route-toolbar-macos-x86_64-slice
          path: build/libroute_toolbar_pi.dylib

  package-universal:
    name: Package macOS universal
    needs: [build-arm64, build-x86_64]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64 slice
        uses: actions/download-artifact@v4
        with:
          name: route-toolbar-macos-arm64-slice
          path: slices/arm64

      - name: Download x86_64 slice
        uses: actions/download-artifact@v4
        with:
          name: route-toolbar-macos-x86_64-slice
          path: slices/x86_64

      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create \
            slices/arm64/libroute_toolbar_pi.dylib \
            slices/x86_64/libroute_toolbar_pi.dylib \
            -output universal/libroute_toolbar_pi.dylib
          codesign --force --sign - universal/libroute_toolbar_pi.dylib
          file universal/libroute_toolbar_pi.dylib
          lipo -info universal/libroute_toolbar_pi.dylib
          lipo -info universal/libroute_toolbar_pi.dylib | grep -q 'arm64'
          lipo -info universal/libroute_toolbar_pi.dylib | grep -q 'x86_64'
          otool -L universal/libroute_toolbar_pi.dylib
          if otool -L universal/libroute_toolbar_pi.dylib | grep -E '/opt/homebrew|/usr/local/Cellar'; then
            echo "Homebrew runtime dependency remains in universal plugin" >&2
            exit 1
          fi

      - name: Build Plugin Manager tarball
        run: |
          ROOT="route_toolbar_pi-0.5.9_darwin-wx32-10-universal"
          mkdir -p "dist/$ROOT/OpenCPN.app/Contents/PlugIns"
          cp universal/libroute_toolbar_pi.dylib "dist/$ROOT/OpenCPN.app/Contents/PlugIns/libroute_toolbar_pi.dylib"
          sed 's/@VERSION@/0.5.9/g' packaging/macos/package-metadata-universal.xml.in > "dist/$ROOT/metadata.xml"
          xmllint --noout "dist/$ROOT/metadata.xml"
          tar -C dist -czf "dist/$ROOT.tar.gz" "$ROOT"
          tar -tzf "dist/$ROOT.tar.gz" | tee /tmp/route-toolbar-universal-package.txt
          grep -q "$ROOT/metadata.xml" /tmp/route-toolbar-universal-package.txt
          grep -q "$ROOT/OpenCPN.app/Contents/PlugIns/libroute_toolbar_pi.dylib" /tmp/route-toolbar-universal-package.txt

      - name: Upload universal Plugin Manager package
        uses: actions/upload-artifact@v4
        with:
          name: route-toolbar-0.5.9-macos-universal-plugin-manager-test
          path: |
            universal/libroute_toolbar_pi.dylib
            dist/route_toolbar_pi-0.5.9_darwin-wx32-10-universal.tar.gz
