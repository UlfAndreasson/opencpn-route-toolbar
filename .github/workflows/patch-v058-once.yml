name: patch-v058-once
on:
  push:
    branches: [finalize-import-visibility-v0.5.8]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize-import-visibility-v0.5.8
      - name: Apply v0.5.8 changes
        shell: python
        run: |
          from pathlib import Path

          # Version + slightly softer/grayer toolbar icon.
          p = Path('src/route_toolbar_pi.cpp')
          s = p.read_text()
          s = s.replace('constexpr int kPluginVersionPatch = 7;',
                        'constexpr int kPluginVersionPatch = 8;', 1)
          s = s.replace('stroke="#aeb4ba"', 'stroke="#989fa5"')
          p.write_text(s)

          # Leg info follows OpenCPN route visibility in both DC and GL paths.
          p = Path('src/route_labels.cpp')
          s = p.read_text()
          needle = '''    auto route = GetRoute_Plugin(routes[r]);\n    if (!route || !route->pWaypointList) continue;\n'''
          repl = '''    auto route = GetRoute_Plugin(routes[r]);\n    if (!route || !route->pWaypointList) continue;\n    auto route_ex = GetRouteExV2_Plugin(routes[r]);\n    if (route_ex && !route_ex->m_isVisible) continue;\n'''
          if s.count(needle) != 2:
              raise SystemExit(f'expected 2 route label loops, found {s.count(needle)}')
          s = s.replace(needle, repl)
          p.write_text(s)

          # GPX import: OpenCPN owns the route. Existing routes are never
          # rewritten unless user explicitly chooses Import as new.
          p = Path('src/route_gpx.cpp')
          s = p.read_text()

          old = '''  bool import_as_new = false;\n\n  std::unique_ptr<PlugIn_Route>\n      existing_backup;\n\n  if (existing_route) {\n    existing_backup =\n        GetRoute_Plugin(\n            old_route_guid);\n\n    wxMessageDialog conflict_dialog(\n'''
          new = '''  bool import_as_new = false;\n\n  const auto belongs_to_existing_route = [&](const wxString& guid,\n                                               const wxString& name) {\n    return guid == old_route_guid ||\n           (guid.IsEmpty() && name == route_name);\n  };\n\n  const bool has_existing_toolbar_objects =\n      existing_route &&\n      (std::any_of(m_ebl_vrms.begin(), m_ebl_vrms.end(),\n                   [&](const RouteEblVrm& item) {\n                     return !item.start_is_mark &&\n                            belongs_to_existing_route(item.route_guid,\n                                                      item.route_name);\n                   }) ||\n       std::any_of(m_pils.begin(), m_pils.end(),\n                   [&](const RoutePil& item) {\n                     return belongs_to_existing_route(item.route_guid,\n                                                      item.route_name);\n                   }) ||\n       std::any_of(m_turns.begin(), m_turns.end(),\n                   [&](const RouteTurn& item) {\n                     return belongs_to_existing_route(item.route_guid,\n                                                      item.route_name);\n                   }));\n\n  if (existing_route && has_existing_toolbar_objects) {\n    wxMessageDialog conflict_dialog(\n'''
          if old not in s:
              raise SystemExit('import conflict block start not found')
          s = s.replace(old, new, 1)

          # Add reuse flag after conflict handling.
          old = '''    import_as_new =\n        answer == wxID_NO;\n  }\n\n  wxString new_route_guid =\n'''
          new = '''    import_as_new =\n        answer == wxID_NO;\n  }\n\n  const bool reuse_existing_route =\n      existing_route && !import_as_new;\n\n  wxString new_route_guid =\n'''
          if old not in s:
              raise SystemExit('reuse insertion point not found')
          s = s.replace(old, new, 1)

          # Map package waypoint GUIDs onto the current OpenCPN route by order
          # when reusing it, so the toolbar package follows the current route
          # without replacing/editing the route itself.
          old = '''    if (!old_guid.IsEmpty())\n      waypoint_guid_map[\n          old_guid] =\n              waypoint.guid;\n  }\n\n  // ----------------------------------------------------------\n  // Parse/add referenced standalone Marks.\n'''
          new = '''    if (!old_guid.IsEmpty())\n      waypoint_guid_map[\n          old_guid] =\n              waypoint.guid;\n  }\n\n  if (reuse_existing_route) {\n    auto current_route = GetRoute_Plugin(old_route_guid);\n    if (current_route && current_route->pWaypointList) {\n      size_t index = 0;\n      for (auto node = current_route->pWaypointList->GetFirst();\n           node && index < waypoints.size();\n           node = node->GetNext(), ++index) {\n        PlugIn_Waypoint* current_wp = node->GetData();\n        if (!current_wp) continue;\n        const wxString package_guid = waypoints[index].guid;\n        if (!package_guid.IsEmpty())\n          waypoint_guid_map[package_guid] = current_wp->m_GUID;\n        waypoints[index].guid = current_wp->m_GUID;\n      }\n    }\n  }\n\n  // ----------------------------------------------------------\n  // Parse/add referenced standalone Marks.\n'''
          if old not in s:
              raise SystemExit('waypoint mapping insertion point not found')
          s = s.replace(old, new, 1)

          # Replace old route delete/recreate block with conditional creation
          # only for a genuinely new route/copy.
          start = s.find('  // ----------------------------------------------------------\n  // Replace route only after parsing succeeded.\n')
          end = s.find('  // ----------------------------------------------------------\n  // Replace Route Toolbar objects for existing package.\n', start)
          if start < 0 or end < 0:
              raise SystemExit('route creation block boundaries not found')
          replacement = '''  // ----------------------------------------------------------\n  // OpenCPN owns the route. Reuse an existing route unchanged; create the\n  // GPX route only when it does not exist or the user chose Import as new.\n  // ----------------------------------------------------------\n\n  if (!reuse_existing_route) {\n    PlugIn_Route imported_route;\n\n    imported_route.m_NameString = route_name;\n    imported_route.m_GUID = new_route_guid;\n\n    for (const GpxWaypoint& waypoint : waypoints) {\n      wxString symbol = waypoint.symbol;\n      if (symbol.IsEmpty()) symbol = "circle";\n\n      auto* imported_waypoint = new PlugIn_Waypoint(\n          waypoint.lat, waypoint.lon, symbol, waypoint.name, waypoint.guid);\n      imported_route.pWaypointList->Append(imported_waypoint);\n    }\n\n    if (!AddPlugInRoute(&imported_route, true)) {\n      wxMessageBox(\n          _("OpenCPN could not create the imported route."),\n          _("Route GPX"),\n          wxOK | wxICON_ERROR,\n          m_dialog ? static_cast<wxWindow*>(m_dialog) : m_parent_window);\n      return;\n    }\n  }\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # Docs/version notes.
          p = Path('README.md')
          s = p.read_text().replace('**Route Toolbar 0.5.7**', '**Route Toolbar 0.5.8**', 1)
          p.write_text(s)

          p = Path('docs/BUILDING.md')
          s = p.read_text().replace('- Route Toolbar 0.5.7', '- Route Toolbar 0.5.8', 1)
          p.write_text(s)

          p = Path('docs/SPEC.md')
          s = p.read_text().replace('## Version 0.5.7 scope', '## Version 0.5.8 scope', 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.5.8 — 2026-10-12\n\n### Changed\n\n- leg course/distance info now follows the OpenCPN route visibility state\n- importing a package onto an existing route with no Route Toolbar objects now attaches EBL/PIL/TURN directly without prompting or rewriting the route\n- when Route Toolbar objects already exist, Replace updates only the toolbar package; Import as new creates a new route copy\n- existing OpenCPN routes and waypoints remain owned and edited by OpenCPN\n- toolbar icon linework softened further to #989FA5\n\n'''
          if '## 0.5.8 — 2026-10-12' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Route Toolbar CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/route_toolbar_pi.cpp src/route_labels.cpp src/route_gpx.cpp README.md CHANGELOG.md docs/BUILDING.md docs/SPEC.md
          git commit -m "Route Toolbar 0.5.8 finalize import and route visibility"
          git push origin HEAD:finalize-import-visibility-v0.5.8
