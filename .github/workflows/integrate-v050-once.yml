name: integrate-v050-once

on:
  push:
    branches:
      - feature/route-turn-v0.5.0-integrated-work2

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/route-turn-v0.5.0-integrated-work2

      - name: Integrate saved TURN work with 0.4.1 fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/route-turn-v0.5.0-save
          git checkout origin/feature/route-turn-v0.5.0-save -- src/route_toolbar_pi.cpp src/route_pil.cpp src/route_context.cpp

          python3 - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch marker: {label}")
              return text.replace(old, new, 1)

          p = Path('src/route_toolbar_pi.cpp')
          s = p.read_text()

          s = rep(s,
              '  if ((m_ebl_mode == EblMode::AwaitTarget ||\n       m_ebl_mode == EblMode::MoveExistingTarget ||',
              '  if ((m_ebl_mode == EblMode::AwaitTarget ||\n       m_ebl_mode == EblMode::MoveExistingStart ||\n       m_ebl_mode == EblMode::MoveExistingTarget ||',
              'cursor start move')

          s = rep(s,
              '  if (m_pil_mode != PilMode::Idle) {',
              '''  if (m_ebl_mode == EblMode::MoveExistingStart) {\n    if (event.RightDown()) {\n      m_ebl_mode = EblMode::Idle;\n      m_edit_item_index = -1;\n      SetStatus(_("Move cancelled. The original EBL/VRM start point was kept."));\n      if (m_parent_window) RequestRefresh(m_parent_window);\n      return true;\n    }\n    if (event.LeftDown() && m_has_cursor)\n      return CommitMoveEblStart(m_cursor_lat, m_cursor_lon);\n    return false;\n  }\n\n  if (m_pil_mode != PilMode::Idle) {''',
              'start move mouse mode')

          s = rep(s,
              '    const int existing = FindNearestEblTarget(m_cursor_lat, m_cursor_lon,\n                                              kTargetPickRadiusNm);',
              '    const int existing = FindNearestEblGeometry(m_cursor_lat, m_cursor_lon, 0.05);',
              'geometry click hit')

          s = rep(s,
              '  actions.Add(_("Move target"));',
              '  actions.Add(_("Move start point"));\n  actions.Add(_("Move target"));',
              'move start action')

          s = rep(s,
              '''  switch (selected) {\n    case 0: BeginMoveEblTarget(index); break;\n    case 1: BeginMoveEblLabel(index); break;\n    case 2: ResetEblLabel(index); break;\n    case 3: RenameEblTarget(index); break;\n    case 4: DeleteEblTarget(index); break;\n    default: break;\n  }\n}\n\nvoid route_toolbar_pi::BeginMoveEblTarget(int index) {''',
              '''  switch (selected) {\n    case 0: BeginMoveEblStart(index); break;\n    case 1: BeginMoveEblTarget(index); break;\n    case 2: BeginMoveEblLabel(index); break;\n    case 3: ResetEblLabel(index); break;\n    case 4: RenameEblTarget(index); break;\n    case 5: DeleteEblTarget(index); break;\n    default: break;\n  }\n}\n\nvoid route_toolbar_pi::BeginMoveEblStart(int index) {\n  if (index < 0 || static_cast<size_t>(index) >= m_ebl_vrms.size()) return;\n  m_edit_item_index = index;\n  m_ebl_mode = EblMode::MoveExistingStart;\n  SetStatus(_("Move EBL/VRM start point — click the new start position. Right-click to cancel."));\n  if (m_parent_window) RequestRefresh(m_parent_window);\n}\n\nbool route_toolbar_pi::CommitMoveEblStart(double start_lat, double start_lon) {\n  if (m_edit_item_index < 0 || static_cast<size_t>(m_edit_item_index) >= m_ebl_vrms.size()) {\n    m_ebl_mode = EblMode::Idle;\n    m_edit_item_index = -1;\n    return true;\n  }\n  RouteEblVrm moved = m_ebl_vrms[static_cast<size_t>(m_edit_item_index)];\n  moved.start_lat = start_lat;\n  moved.start_lon = start_lon;\n  moved.start_is_mark = false;\n  moved.start_mark_guid.clear();\n  moved.start_mark_name.clear();\n  moved.start_is_turn = false;\n  moved.start_turn_end = false;\n  moved.start_turn_route_guid.clear();\n  moved.start_turn_waypoint_guid.clear();\n  moved.start_turn_waypoint_name.clear();\n  moved.start_is_free = true;\n  moved.route_guid.clear();\n  moved.route_name.clear();\n  moved.waypoint_guid.clear();\n  moved.waypoint_name.clear();\n  RecalculateEbl(moved);\n  if (moved.range_nm < 0.001) {\n    SetStatus(_("Start point is too close to the target. Click another position or right-click to cancel."));\n    return true;\n  }\n  m_ebl_vrms[static_cast<size_t>(m_edit_item_index)] = moved;\n  SavePersistentState();\n  SetStatus(wxString::Format(_("EBL/VRM start moved — %03.0f°T · %.2f NM"),\n                             moved.bearing_true, moved.range_nm));\n  m_ebl_mode = EblMode::Idle;\n  m_edit_item_index = -1;\n  if (m_parent_window) RequestRefresh(m_parent_window);\n  return true;\n}\n\nvoid route_toolbar_pi::BeginMoveEblTarget(int index) {''',
              'move start methods')

          s = rep(s,
              '  m_label_font_size = std::clamp(static_cast<int>(font_size), kMinLabelFontSize,\n                                 kMaxLabelFontSize);\n  wxString colour_text;',
              '  m_label_font_size = std::clamp(static_cast<int>(font_size), kMinLabelFontSize,\n                                 kMaxLabelFontSize);\n  config->Read("NotesVisible", &m_notes_visible, true);\n  wxString colour_text;',
              'load notes visible')

          s = rep(s,
              '  config->Write("LabelFontSize", static_cast<long>(m_label_font_size));\n  config->Write("EblColour",',
              '  config->Write("LabelFontSize", static_cast<long>(m_label_font_size));\n  config->Write("NotesVisible", m_notes_visible);\n  config->Write("EblColour",',
              'save notes visible')

          s = rep(s,
              '  bool rendered = false;\n  for (const RouteTurn& turn : m_turns) {',
              '  bool rendered = false;\n  DrawRouteLegLabels(dc, vp);\n  rendered = true;\n  for (const RouteTurn& turn : m_turns) {',
              'wx route labels')

          s = rep(s,
              '  glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);\n\n  for (const RouteTurn& turn : m_turns) {',
              '  glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);\n\n  DrawRouteLegLabelsGL(vp);\n  rendered = true;\n\n  for (const RouteTurn& turn : m_turns) {',
              'gl route labels')

          s = rep(s,
              '''  dc.DrawLine(target_px.x - cross, target_px.y, target_px.x + cross, target_px.y);\n  dc.DrawLine(target_px.x, target_px.y - cross, target_px.x, target_px.y + cross);\n\n  // The EBL geometry may cross the visible viewport even when the''',
              '''  dc.DrawLine(target_px.x - cross, target_px.y, target_px.x + cross, target_px.y);\n  dc.DrawLine(target_px.x, target_px.y - cross, target_px.x, target_px.y + cross);\n\n  if (!m_notes_visible) {\n    dc.SetPen(old_pen);\n    dc.SetBrush(old_brush);\n    dc.SetTextForeground(old_text);\n    dc.SetFont(old_font);\n    return;\n  }\n\n  // The EBL geometry may cross the visible viewport even when the''',
              'hide wx EBL notes')

          s = rep(s,
              '''  glVertex2i(target_px.x, target_px.y + cross);\n  glEnd();\n\n  // Do not pin labels belonging to off-screen sight marks to''',
              '''  glVertex2i(target_px.x, target_px.y + cross);\n  glEnd();\n\n  if (!m_notes_visible) return;\n\n  // Do not pin labels belonging to off-screen sight marks to''',
              'hide gl EBL notes')

          s = rep(s,
              '  dialog.SetSizer(top);\n  dialog.CentreOnParent();\n  dialog.ShowModal();',
              '  populate();\n  dialog.SetSizer(top);\n  dialog.CentreOnParent();\n  dialog.ShowModal();',
              'initial object population')

          p.write_text(s)

          p = Path('src/route_context.cpp')
          s = p.read_text()
          marker = 'int route_toolbar_pi::FindNearestPil(double lat, double lon,\n                                     double max_distance_nm) const {'
          geom = '''int route_toolbar_pi::FindNearestEblGeometry(double lat, double lon,\n                                             double max_distance_nm) const {\n  int best = -1;\n  double best_distance = std::numeric_limits<double>::max();\n  const XY p{0.0, 0.0};\n  for (size_t i = 0; i < m_ebl_vrms.size(); ++i) {\n    const RouteEblVrm& ebl = m_ebl_vrms[i];\n    if (!ebl.visible) continue;\n    const XY a = ToLocalNm(ebl.start_lat, ebl.start_lon, lat, lon);\n    const XY b = ToLocalNm(ebl.target_lat, ebl.target_lon, lat, lon);\n    const double distance = std::min(\n        DistancePointToSegmentNm(p, a, b),\n        std::min(std::hypot(a.x, a.y), std::hypot(b.x, b.y)));\n    if (distance <= max_distance_nm && distance < best_distance) {\n      best = static_cast<int>(i);\n      best_distance = distance;\n    }\n  }\n  return best;\n}\n\n'''
          s = rep(s, marker, geom + marker, 'context geometry function')
          s = rep(s,
              '    const int ebl = FindNearestEblTarget(m_cursor_lat, m_cursor_lon, 0.04);',
              '    const int ebl = FindNearestEblGeometry(m_cursor_lat, m_cursor_lon, 0.05);',
              'context geometry lookup')
          s = rep(s,
              'No Route Toolbar EBL/VRM target was found close to the right-click position.',
              'No Route Toolbar EBL/VRM start point, target or line was found close to the right-click position.',
              'context message')
          p.write_text(s)

          p = Path('src/route_pil.cpp')
          s = p.read_text()
          s = rep(s, 'constexpr int kPilDashSegments = 28;',
                     'constexpr int kPilDashSegments = 56;', 'PIL GL dash density')
          s = rep(s, 'wxPENSTYLE_LONG_DASH', 'wxPENSTYLE_SHORT_DASH', 'PIL wx dash style')
          old = '''  const wxString label = PilLabel(item.offset_nm);\n  dc.SetFont(GetEblLabelFont());\n  const wxSize text = dc.GetTextExtent(label);\n  const wxPoint pos(anchor_px.x + 12, anchor_px.y - text.y - 10);\n  dc.SetPen(*wxTRANSPARENT_PEN);\n  dc.SetBrush(wxBrush(wxColour(205, 245, 245)));\n  dc.DrawRectangle(pos.x - 4, pos.y - 3, text.x + 8, text.y + 6);\n  dc.SetTextForeground(*wxBLACK);\n  dc.DrawText(label, pos);'''
          new = '''  if (m_notes_visible) {\n    const wxString label = PilLabel(item.offset_nm);\n    dc.SetFont(GetEblLabelFont());\n    const wxSize text = dc.GetTextExtent(label);\n    const wxPoint pos(anchor_px.x + 12, anchor_px.y - text.y - 10);\n    dc.SetPen(*wxTRANSPARENT_PEN);\n    dc.SetBrush(wxBrush(wxColour(205, 245, 245)));\n    dc.DrawRectangle(pos.x - 4, pos.y - 3, text.x + 8, text.y + 6);\n    dc.SetTextForeground(*wxBLACK);\n    dc.DrawText(label, pos);\n  }'''
          s = rep(s, old, new, 'hide PIL wx note')
          s = rep(s,
              '  DrawGlLabel(PilLabel(item.offset_nm), anchor_px.x + 12,\n              anchor_px.y - 30);',
              '  if (m_notes_visible)\n    DrawGlLabel(PilLabel(item.offset_nm), anchor_px.x + 12,\n                anchor_px.y - 30);',
              'hide PIL GL note')
          p.write_text(s)
          PY

          rm -f .github/workflows/integrate-v050-once.yml
          git config user.name "Route Toolbar CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate TURN with 0.4.1 and fix notes, objects and PIL dashes"
          git push origin HEAD:feature/route-turn-v0.5.0-integrated-work2
