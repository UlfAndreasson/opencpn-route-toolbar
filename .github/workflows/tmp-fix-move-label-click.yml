name: Temporary fix Move labels click handling

on:
  push:
    branches:
      - fix/move-label-no-chart-jump
    paths:
      - '.github/workflows/tmp-fix-move-label-click.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/move-label-no-chart-jump
      - name: Consume label clicks before OpenCPN recenters chart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/route_label_move.cpp')
          s = p.read_text()
          old = '''    if (mouse->RightDown()) {
      m_owner->OnMoveLabelsMouse(*mouse);
      return wxEventFilter::Event_Processed;
    }

    if (wxTheApp) {
      wxMouseEvent deferred(*mouse);
      route_toolbar_pi* owner = m_owner;
      wxTheApp->CallAfter([owner, deferred]() mutable {
        if (owner && owner->m_move_labels_active)
          owner->OnMoveLabelsMouse(deferred);
      });
    }

    return wxEventFilter::Event_Skip;
'''
          new = '''    if (mouse->RightDown() || mouse->LeftDown()) {
      // Mouse motion has already kept SetCursorLatLon() current. Handle button
      // presses immediately and consume them so OpenCPN does not pan/recenter
      // the chart underneath a label move operation.
      m_owner->OnMoveLabelsMouse(*mouse);
      return wxEventFilter::Event_Processed;
    }

    // Motion must still reach OpenCPN so WANTS_CURSOR_LATLON keeps the cursor
    // lat/lon current. Process our label-follow update after OpenCPN handles it.
    if (wxTheApp) {
      wxMouseEvent deferred(*mouse);
      route_toolbar_pi* owner = m_owner;
      wxTheApp->CallAfter([owner, deferred]() mutable {
        if (owner && owner->m_move_labels_active)
          owner->OnMoveLabelsMouse(deferred);
      });
    }

    return wxEventFilter::Event_Skip;
'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/route_label_move.cpp
          git commit -m 'Fix Move labels chart jump on click'
          git push origin HEAD:fix/move-label-no-chart-jump
